<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>李聃 Alan Li · 个人主页（基础版）</title>
<meta name="description" content="李聃（Alan Li）的个人主页与在线简历" />
<style>
/* ==========================================================
   【配色】想换主题色，只改下面 :root 里的变量即可
   ========================================================== */
:root {
  --bg: #f6f7fb; --bg-alt: #eef0f8; --surface: #ffffff; --surface-2: #f2f4fa;
  --text: #171a26; --text-soft: #3d4356; --muted: #6b7186; --border: #e3e6f0;
  --accent: #4f6df5; --accent-2: #8b5cf6; --accent-soft: rgba(79,109,245,.1);
  --grad: linear-gradient(120deg,#4f6df5,#8b5cf6);
  --shadow-sm: 0 2px 8px rgba(23,26,38,.06); --shadow-md: 0 10px 30px rgba(23,26,38,.1); --shadow-lg: 0 20px 50px rgba(23,26,38,.14);
  --radius: 16px; --radius-sm: 10px; --nav-h: 64px;
  --font-sans: "Inter","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --font-serif: "Noto Serif SC","Songti SC",Georgia,serif;
}
[data-theme="dark"] {
  --bg: #0d0f16; --bg-alt: #11141e; --surface: #161a26; --surface-2: #1c2130;
  --text: #e9ebf4; --text-soft: #c3c8da; --muted: #8f96ad; --border: #262b3d;
  --accent: #7b91ff; --accent-2: #a78bfa; --accent-soft: rgba(123,145,255,.14);
  --shadow-sm: 0 2px 8px rgba(0,0,0,.3); --shadow-md: 0 10px 30px rgba(0,0,0,.4); --shadow-lg: 0 20px 50px rgba(0,0,0,.5);
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html { scroll-behavior:smooth; scroll-padding-top: calc(var(--nav-h) + 16px); }
body { font-family:var(--font-sans); background:var(--bg); color:var(--text); line-height:1.7; -webkit-font-smoothing:antialiased; transition:background .35s,color .35s; }
a { color:inherit; text-decoration:none; } ul { list-style:none; }
.container { max-width:1080px; margin:0 auto; padding:0 24px; }

/* 导航 */
.nav { position:fixed; top:0; left:0; right:0; height:var(--nav-h); z-index:100; background:rgba(246,247,251,.8); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-bottom:1px solid transparent; transition:border-color .3s,background .35s; }
[data-theme="dark"] .nav { background:rgba(13,15,22,.8); }
.nav.scrolled { border-bottom-color:var(--border); }
.nav-inner { max-width:1080px; margin:0 auto; height:100%; padding:0 24px; display:flex; align-items:center; justify-content:space-between; gap:16px; }
.nav-logo { font-weight:800; font-size:1.2rem; letter-spacing:-.02em; }
.nav-logo span { background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
.nav-links { display:flex; gap:4px; }
.nav-link { padding:8px 14px; border-radius:999px; font-size:.92rem; color:var(--muted); transition:color .2s,background .2s; }
.nav-link:hover { color:var(--text); background:var(--surface-2); }
.nav-link.active { color:var(--accent); background:var(--accent-soft); font-weight:600; }
.nav-actions { display:flex; align-items:center; gap:10px; }
.theme-toggle { width:38px; height:38px; border:1px solid var(--border); background:var(--surface); color:var(--text-soft); border-radius:50%; cursor:pointer; display:grid; place-items:center; transition:transform .25s,box-shadow .25s,border-color .25s; }
.theme-toggle:hover { transform:translateY(-2px) rotate(12deg); box-shadow:var(--shadow-md); border-color:var(--accent); }
.theme-toggle svg { width:18px; height:18px; }
.icon-moon { display:none; } [data-theme="dark"] .icon-sun { display:none; } [data-theme="dark"] .icon-moon { display:block; }
.menu-toggle { display:none; width:38px; height:38px; border:1px solid var(--border); background:var(--surface); border-radius:10px; cursor:pointer; flex-direction:column; align-items:center; justify-content:center; gap:5px; }
.menu-toggle span { width:16px; height:2px; background:var(--text-soft); border-radius:2px; transition:transform .25s,opacity .25s; }
.menu-toggle.open span:nth-child(1) { transform:translateY(7px) rotate(45deg); }
.menu-toggle.open span:nth-child(2) { opacity:0; }
.menu-toggle.open span:nth-child(3) { transform:translateY(-7px) rotate(-45deg); }

/* Hero */
.hero { position:relative; min-height:100svh; display:flex; align-items:center; padding:calc(var(--nav-h) + 40px) 0 80px; overflow:hidden; }
.hero-bg { position:absolute; inset:0; pointer-events:none; }
.blob { position:absolute; border-radius:50%; filter:blur(80px); opacity:.5; animation:float 12s ease-in-out infinite alternate; }
.blob-1 { width:480px; height:480px; top:-120px; right:-80px; background:radial-gradient(circle,rgba(79,109,245,.45),transparent 65%); }
.blob-2 { width:420px; height:420px; bottom:-140px; left:-100px; background:radial-gradient(circle,rgba(139,92,246,.4),transparent 65%); animation-delay:-6s; }
[data-theme="dark"] .blob { opacity:.32; }
@keyframes float { from{transform:translate(0,0) scale(1)} to{transform:translate(30px,24px) scale(1.08)} }
.grid-overlay { position:absolute; inset:0; background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px); background-size:56px 56px; mask-image:radial-gradient(ellipse 80% 60% at 50% 40%,black 20%,transparent 75%); -webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 40%,black 20%,transparent 75%); opacity:.5; }
.hero-inner { position:relative; display:grid; grid-template-columns:1.35fr 1fr; gap:48px; align-items:center; width:100%; }
.hero-eyebrow { display:inline-block; font-size:.85rem; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); background:var(--accent-soft); border:1px solid rgba(79,109,245,.3); padding:6px 14px; border-radius:999px; margin-bottom:20px; }
.hero-title { font-family:var(--font-serif); font-size:clamp(2.2rem,5.5vw,3.6rem); line-height:1.18; margin-bottom:18px; }
.hero-title .name-en { background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
.hero-sub { font-size:1.05rem; color:var(--muted); max-width:34em; margin-bottom:22px; }
.hero-tags { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:30px; }
.hero-cta { display:flex; flex-wrap:wrap; gap:14px; }
.btn { display:inline-flex; align-items:center; gap:8px; padding:12px 26px; border-radius:999px; font-size:.95rem; font-weight:600; cursor:pointer; border:1px solid transparent; transition:transform .22s,box-shadow .22s,border-color .22s,color .22s; }
.btn-primary { background:var(--grad); color:#fff; box-shadow:0 8px 24px rgba(99,102,241,.35); }
.btn-primary:hover { transform:translateY(-3px); box-shadow:0 14px 34px rgba(99,102,241,.45); }
.btn-ghost { background:var(--surface); color:var(--text-soft); border-color:var(--border); }
.btn-ghost:hover { transform:translateY(-3px); border-color:var(--accent); color:var(--accent); box-shadow:var(--shadow-md); }
.hero-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow-lg); padding:28px; transition:transform .3s; }
.hero-card:hover { transform:translateY(-6px); }
.hero-card .avatar { width:84px; height:84px; border-radius:24px; background:var(--grad); color:#fff; font-size:1.7rem; font-weight:800; display:grid; place-items:center; margin-bottom:18px; box-shadow:0 10px 24px rgba(99,102,241,.35); overflow:hidden; position:relative; }
.hero-card .avatar img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.hero-card h3 { font-size:1.15rem; margin-bottom:4px; }
.hero-card .role { font-size:.9rem; color:var(--accent); font-weight:600; margin-bottom:16px; }
.hero-card .fact { display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-top:1px dashed var(--border); font-size:.88rem; color:var(--text-soft); }
.hero-card .fact svg { flex:none; width:16px; height:16px; margin-top:4px; color:var(--accent); }
.scroll-hint { position:absolute; bottom:26px; left:50%; transform:translateX(-50%); width:40px; height:40px; display:grid; place-items:center; color:var(--muted); border:1px solid var(--border); border-radius:50%; background:var(--surface); animation:bounce 2.2s ease-in-out infinite; }
.scroll-hint:hover { color:var(--accent); border-color:var(--accent); }
.scroll-hint svg { width:18px; height:18px; }
@keyframes bounce { 0%,100%{transform:translateX(-50%) translateY(0)} 50%{transform:translateX(-50%) translateY(8px)} }

/* 区块 */
.section { padding:96px 0; }
.section-alt { background:var(--bg-alt); transition:background .35s; }
.section-head { margin-bottom:48px; }
.section-kicker { display:inline-block; font-size:.8rem; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); margin-bottom:10px; }
.section-head h2 { font-family:var(--font-serif); font-size:clamp(1.6rem,3.4vw,2.2rem); }
.section-head h2::after { content:""; display:block; width:56px; height:4px; border-radius:4px; background:var(--grad); margin-top:14px; }
.section-desc { margin-top:12px; color:var(--muted); font-size:.95rem; }

/* 卡片 */
.card-grid { display:grid; gap:22px; }
.card-grid.two-col { grid-template-columns:repeat(2,1fr); }
.card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:26px 28px; box-shadow:var(--shadow-sm); transition:transform .28s,box-shadow .28s,border-color .28s; }
.card:hover { transform:translateY(-6px); box-shadow:var(--shadow-lg); border-color:rgba(79,109,245,.45); }
.card .card-period { display:inline-block; font-size:.78rem; font-weight:600; color:var(--accent); background:var(--accent-soft); padding:3px 12px; border-radius:999px; margin-bottom:12px; }
.card h3 { font-size:1.12rem; margin-bottom:4px; }
.card .card-sub { font-size:.9rem; color:var(--accent); font-weight:600; margin-bottom:12px; }
.card .card-desc { font-size:.92rem; color:var(--text-soft); }
.card .card-list { margin-top:10px; display:grid; gap:8px; }
.card .card-list li { position:relative; padding-left:16px; font-size:.9rem; color:var(--text-soft); }
.card .card-list li::before { content:""; position:absolute; left:0; top:.72em; width:6px; height:6px; border-radius:50%; background:var(--grad); }

/* 关于 */
.about-grid { display:grid; grid-template-columns:1.5fr 1fr; gap:22px; align-items:stretch; }
.about-text { font-size:1rem; color:var(--text-soft); display:grid; gap:14px; align-content:start; }
.about-text strong { color:var(--text); }
.about-stats { display:grid; gap:14px; }
.stat-box { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:18px 20px; box-shadow:var(--shadow-sm); transition:transform .25s,box-shadow .25s; }
.stat-box:hover { transform:translateY(-4px); box-shadow:var(--shadow-md); }
.stat-box .num { font-size:1.5rem; font-weight:800; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
.stat-box .label { font-size:.85rem; color:var(--muted); margin-top:2px; }

/* 时间线 */
.timeline { position:relative; padding-left:28px; }
.timeline::before { content:""; position:absolute; left:7px; top:8px; bottom:8px; width:2px; background:linear-gradient(var(--accent),var(--accent-2)); border-radius:2px; opacity:.5; }
.timeline-item { position:relative; padding-bottom:34px; }
.timeline-item:last-child { padding-bottom:0; }
.timeline-item::before { content:""; position:absolute; left:-27px; top:8px; width:12px; height:12px; border-radius:50%; background:var(--surface); border:3px solid var(--accent); box-shadow:0 0 0 4px var(--accent-soft); }
.timeline-item .card { margin-left:8px; }

/* 项目 */
.project-card .project-org { font-size:.85rem; color:var(--muted); margin-bottom:10px; }
.project-card .project-result { margin-top:14px; padding:12px 14px; background:var(--accent-soft); border-left:3px solid var(--accent); border-radius:0 var(--radius-sm) var(--radius-sm) 0; font-size:.88rem; color:var(--text-soft); }
.project-card .project-result strong { color:var(--accent); }

/* 技能 */
.skills-wrap { display:grid; gap:26px; margin-bottom:40px; }
.skill-group h3 { font-size:.95rem; color:var(--text-soft); margin-bottom:12px; display:flex; align-items:center; gap:10px; }
.skill-group h3::before { content:""; width:8px; height:8px; border-radius:2px; background:var(--grad); }
.tag { display:inline-block; padding:7px 15px; margin:0 8px 8px 0; font-size:.85rem; color:var(--text-soft); background:var(--surface); border:1px solid var(--border); border-radius:999px; cursor:default; transition:transform .2s,border-color .2s,color .2s,box-shadow .2s; }
.tag:hover { transform:translateY(-3px); border-color:var(--accent); color:var(--accent); box-shadow:var(--shadow-md); }
.honors { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:26px 28px; box-shadow:var(--shadow-sm); }
.honors h3 { font-size:1.05rem; margin-bottom:14px; }
.honors li { position:relative; padding-left:22px; margin-bottom:8px; font-size:.92rem; color:var(--text-soft); }
.honors li::before { content:""; position:absolute; left:0; top:.62em; width:10px; height:10px; border-radius:3px; background:var(--grad); }

/* 论文 */
.pub-list { display:grid; gap:20px; }
.pub-card { background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--accent); border-radius:var(--radius); padding:24px 28px; box-shadow:var(--shadow-sm); transition:transform .28s,box-shadow .28s; }
.pub-card:hover { transform:translateY(-5px) translateX(4px); box-shadow:var(--shadow-lg); }
.pub-badges { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
.badge { font-size:.74rem; font-weight:600; padding:3px 11px; border-radius:999px; }
.badge-role { background:var(--grad); color:#fff; }
.badge-journal { background:var(--accent-soft); color:var(--accent); border:1px solid rgba(79,109,245,.3); }
.badge-status { background:var(--surface-2); color:var(--muted); border:1px dashed var(--border); }
.badge-status.review { color:#d97706; border-color:#d97706; background:rgba(217,119,6,.08); }
.pub-title { font-size:1.05rem; font-weight:700; line-height:1.5; margin-bottom:8px; }
.pub-title a:hover { color:var(--accent); text-decoration:underline; text-underline-offset:3px; }
.pub-authors { font-size:.88rem; color:var(--muted); margin-bottom:4px; }
.pub-authors .me { color:var(--accent); font-weight:700; }
.pub-journal { font-size:.88rem; color:var(--text-soft); font-style:italic; }
.pub-footer { margin-top:14px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.pub-note { font-size:.82rem; color:var(--muted); }
.pub-link { display:inline-flex; align-items:center; gap:6px; font-size:.85rem; font-weight:600; color:var(--accent); padding:7px 16px; border:1px solid rgba(79,109,245,.4); border-radius:999px; transition:background .2s,color .2s,transform .2s; }
.pub-link:hover { background:var(--accent); color:#fff; transform:translateY(-2px); }
.pub-link svg { width:14px; height:14px; }
.pub-link.disabled { color:var(--muted); border-color:var(--border); cursor:default; pointer-events:none; }

/* 联系 */
.contact-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:18px; }
.contact-card { display:flex; align-items:center; gap:14px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px 22px; box-shadow:var(--shadow-sm); transition:transform .25s,box-shadow .25s,border-color .25s; }
.contact-card:hover { transform:translateY(-4px); box-shadow:var(--shadow-md); border-color:var(--accent); }
.contact-card .c-icon { flex:none; width:44px; height:44px; border-radius:12px; background:var(--accent-soft); color:var(--accent); display:grid; place-items:center; }
.contact-card .c-icon svg { width:20px; height:20px; }
.contact-card .c-label { font-size:.78rem; color:var(--muted); }
.contact-card .c-value { font-size:.95rem; font-weight:600; word-break:break-all; }

/* 页脚 */
.footer { border-top:1px solid var(--border); padding:28px 0; }
.footer-inner { display:flex; align-items:center; justify-content:space-between; gap:16px; color:var(--muted); font-size:.88rem; }
.to-top { flex:none; width:38px; height:38px; display:grid; place-items:center; border:1px solid var(--border); border-radius:50%; color:var(--muted); transition:color .2s,border-color .2s,transform .2s; }
.to-top:hover { color:var(--accent); border-color:var(--accent); transform:translateY(-3px); }
.to-top svg { width:16px; height:16px; }

/* 动画 */
.reveal { opacity:0; transform:translateY(26px); transition:opacity .7s,transform .7s; }
.reveal.visible { opacity:1; transform:translateY(0); }

/* 响应式 */
@media (max-width:900px) {
  .hero-inner { grid-template-columns:1fr; gap:32px; }
  .about-grid { grid-template-columns:1fr; }
  .card-grid.two-col { grid-template-columns:1fr; }
}
@media (max-width:768px) {
  .section { padding:72px 0; }
  .menu-toggle { display:flex; }
  .nav-links { position:fixed; top:var(--nav-h); left:0; right:0; flex-direction:column; gap:4px; padding:14px 20px 20px; background:var(--surface); border-bottom:1px solid var(--border); box-shadow:var(--shadow-md); transform:translateY(-12px); opacity:0; pointer-events:none; transition:transform .25s,opacity .25s; }
  .nav-links.open { transform:translateY(0); opacity:1; pointer-events:auto; }
  .nav-link { display:block; padding:10px 14px; }
  .hero { padding-top:calc(var(--nav-h) + 28px); }
  .hero-cta .btn { flex:1; justify-content:center; }
  .scroll-hint { display:none; }
}
@media (prefers-reduced-motion:reduce) {
  html { scroll-behavior:auto; }
  .blob,.scroll-hint { animation:none; }
  .reveal { opacity:1; transform:none; transition:none; }
}
</style>
</head>
<body>

<header class="nav" id="nav">
  <div class="nav-inner">
    <a href="#home" class="nav-logo">Alan<span> Li</span></a>
    <nav class="nav-links" id="navLinks">
      <a href="#about" class="nav-link">关于</a>
      <a href="#education" class="nav-link">教育</a>
      <a href="#experience" class="nav-link">经历</a>
      <a href="#projects" class="nav-link">项目</a>
      <a href="#skills" class="nav-link">技能</a>
      <a href="#publications" class="nav-link">论文</a>
      <a href="#contact" class="nav-link">联系</a>
    </nav>
    <div class="nav-actions">
      <button class="theme-toggle" id="themeToggle" aria-label="切换主题" title="切换深色/浅色">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
      </button>
      <button class="menu-toggle" id="menuToggle" aria-label="菜单"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

<main>
  <section class="hero" id="home">
    <div class="hero-bg"><div class="blob blob-1"></div><div class="blob blob-2"></div><div class="grid-overlay"></div></div>
    <div class="container hero-inner">
      <div class="hero-text reveal">
        <p class="hero-eyebrow" id="heroEyebrow"></p>
        <h1 class="hero-title" id="heroTitle"></h1>
        <p class="hero-sub" id="heroSub"></p>
        <div class="hero-tags" id="heroTags"></div>
        <div class="hero-cta">
          <a href="#publications" class="btn btn-primary">查看论文成果</a>
          <a href="#contact" class="btn btn-ghost">联系我</a>
        </div>
      </div>
      <aside class="hero-card reveal" id="heroCard"></aside>
    </div>
    <a href="#about" class="scroll-hint" aria-label="向下滚动"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg></a>
  </section>

  <section class="section" id="about"><div class="container">
    <div class="section-head reveal"><span class="section-kicker">About</span><h2>个人简介</h2></div>
    <div class="about-grid" id="aboutGrid"></div>
  </div></section>

  <section class="section section-alt" id="education"><div class="container">
    <div class="section-head reveal"><span class="section-kicker">Education</span><h2>教育背景</h2></div>
    <div class="card-grid two-col" id="educationGrid"></div>
  </div></section>

  <section class="section" id="experience"><div class="container">
    <div class="section-head reveal"><span class="section-kicker">Experience</span><h2>工作与实习经历</h2></div>
    <div class="timeline" id="experienceTimeline"></div>
  </div></section>

  <section class="section section-alt" id="projects"><div class="container">
    <div class="section-head reveal"><span class="section-kicker">Projects</span><h2>参与项目</h2></div>
    <div class="card-grid" id="projectsGrid"></div>
  </div></section>

  <section class="section" id="skills"><div class="container">
    <div class="section-head reveal"><span class="section-kicker">Skills</span><h2>技能标签</h2></div>
    <div class="skills-wrap" id="skillsWrap"></div>
    <div class="honors reveal" id="honorsWrap"></div>
  </div></section>

  D.education.forEach(function (e, i) {
    var c = el("div", "card reveal"); c.style.transitionDelay = (i * 80) + "ms";
    var h = '<span class="card-period">' + esc(e.period) + "</span><h3>" + esc(e.school) + '</h3><p class="card-sub">' + esc(e.degree) + '</p><p class="card-desc">' + esc(e.desc) + "</p>";
    if (e.points.length) { h += '<ul class="card-list">'; e.points.forEach(function (p) { h += "<li>" + esc(p) + "</li>"; }); h += "</ul>"; }
    c.innerHTML = h; eg.appendChild(c);
  });

  /* 经历 */
  var tl = document.getElementById("experienceTimeline");
  D.experience.forEach(function (e, i) {
    var it = el("div", "timeline-item reveal"); it.style.transitionDelay = (i * 60) + "ms";
    var h = '<div class="card"><span class="card-period">' + esc(e.period) + "</span><h3>" + esc(e.title) + '</h3><p class="card-sub">' + esc(e.role) + '</p><ul class="card-list">';
    e.points.forEach(function (p) { h += "<li>" + esc(p) + "</li>"; });
    it.innerHTML = h + "</ul></div>"; tl.appendChild(it);
  });

  /* 项目 */
  var pg = document.getElementById("projectsGrid");
  D.projects.forEach(function (p, i) {
    var c = el("div", "card project-card reveal"); c.style.transitionDelay = (i * 70) + "ms";
    var h = '<span class="card-period">' + esc(p.period) + "</span><h3>" + esc(p.title) + '</h3><p class="project-org">' + esc(p.org) + '</p><ul class="card-list">';
    p.points.forEach(function (pt) { h += "<li>" + esc(pt) + "</li>"; });
    h += "</ul>";
    if (p.result) h += '<div class="project-result">成果：' + p.result + "</div>";
    c.innerHTML = h; pg.appendChild(c);
  });

  /* 技能与荣誉 */
  var sw = document.getElementById("skillsWrap");
  D.skills.forEach(function (g, i) {
    var gr = el("div", "skill-group reveal"); gr.style.transitionDelay = (i * 50) + "ms";
    gr.appendChild(el("h3", null, esc(g.group)));
    var box = el("div");
    g.items.forEach(function (t) { box.appendChild(el("span", "tag", esc(t))); });
    gr.appendChild(box); sw.appendChild(gr);
  });
  var hh = "<h3>荣誉与证书</h3><ul>";
  D.honors.forEach(function (x) { hh += "<li>" + esc(x) + "</li>"; });
  document.getElementById("honorsWrap").innerHTML = hh + "</ul>";

  /* 论文 */
  var pl = document.getElementById("pubList");
  D.publications.forEach(function (p, i) {
    var c = el("article", "pub-card reveal"); c.style.transitionDelay = (i * 60) + "ms";
    var badges = '<div class="pub-badges"><span class="badge badge-role">' + esc(p.role) + "</span>" +
      p.badges.map(function (b) { return '<span class="badge badge-journal">' + esc(b) + "</span>"; }).join("") +
      (p.status === "review" ? '<span class="badge badge-status review">Under Review</span>' : '<span class="badge badge-status">' + esc(p.year) + "</span>") + "</div>";
    var title = p.url ? '<a href="' + esc(p.url) + '" target="_blank" rel="noopener noreferrer">' + esc(p.title) + "</a>" : esc(p.title);
    var authors = p.authors.map(function (a) { return a === "Dan Li" ? '<span class="me">' + esc(a) + "</span>" : esc(a); }).join(", ");
    var link = p.url ? '<a class="pub-link" href="' + esc(p.url) + '" target="_blank" rel="noopener noreferrer">查看论文 ' + ICONS.external + "</a>" : '<span class="pub-link disabled">链接待补充</span>';
    c.innerHTML = badges + '<h3 class="pub-title">' + title + '</h3><p class="pub-authors">' + authors + '</p><p class="pub-journal">' + esc(p.journal) + (p.status === "review" ? "（在审）" : ", " + esc(p.year)) + '</p><div class="pub-footer"><span class="pub-note">' + esc(p.note || "") + "</span>" + link + "</div>";
    pl.appendChild(c);
  });

  /* 联系与页脚 */
  var cg = document.getElementById("contactGrid");
  D.contact.forEach(function (c, i) {
    var n = c.href ? el("a", "contact-card reveal") : el("div", "contact-card reveal");
    if (c.href) { n.href = c.href; if (c.href.indexOf("mailto:") !== 0 && c.href.indexOf("tel:") !== 0) { n.target = "_blank"; n.rel = "noopener noreferrer"; } }
    n.style.transitionDelay = (i * 60) + "ms";
    n.innerHTML = '<div class="c-icon">' + (ICONS[c.icon] || ICONS.mail) + '</div><div><div class="c-label">' + esc(c.label) + '</div><div class="c-value">' + esc(c.value) + "</div></div>";
    cg.appendChild(n);
  });
  document.getElementById("footerText").textContent = D.footer;

  /* 导航交互 */
  var nav = document.getElementById("nav");
  var links = Array.prototype.slice.call(document.querySelectorAll(".nav-link"));
  var sections = links.map(function (l) { return document.querySelector(l.getAttribute("href")); }).filter(Boolean);
  function onScroll() {
    nav.classList.toggle("scrolled", window.scrollY > 8);
    var pos = window.scrollY + 120, cur = "";
    sections.forEach(function (s) { if (s.offsetTop <= pos) cur = s.id; });
    links.forEach(function (l) { l.classList.toggle("active", l.getAttribute("href") === "#" + cur); });
  }
  window.addEventListener("scroll", onScroll, { passive: true });
  onScroll();
  var mt = document.getElementById("menuToggle"), nl = document.getElementById("navLinks");
  mt.addEventListener("click", function () { mt.classList.toggle("open"); nl.classList.toggle("open"); });
  links.forEach(function (l) { l.addEventListener("click", function () { mt.classList.remove("open"); nl.classList.remove("open"); }); });

  /* 入场动画 */
  var targets = document.querySelectorAll(".reveal");
  if ("IntersectionObserver" in window) {
    var ob = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add("visible"); ob.unobserve(e.target); } });
    }, { threshold: 0.12, rootMargin: "0px 0px -40px 0px" });
    targets.forEach(function (t) { ob.observe(t); });
  } else {
    targets.forEach(function (t) { t.classList.add("visible"); });
  }
})();
</script>
</body>
</html>
