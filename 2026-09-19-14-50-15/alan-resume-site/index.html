html { scroll-behavior:smooth; scroll-padding-top:calc(var(--nav-h) + 20px); }

a { color:var(--accent); text-decoration:none; }

ul { list-style:none; }
.wrap { max-width:840px; margin:0 auto; padding:0 22px; }

.nav-right { display:flex; align-items:center; gap:4px; }
.nav-link { padding:6px 11px; font-size:.88rem; color:var(--muted); border-radius:8px; }

.nav-link.active { color:var(--accent); }

.hero-inner { display:grid; grid-template-columns:1fr 168px; gap:36px; align-items:start; }

.hero-links a:hover { border-color:var(--accent); color:var(--accent); text-decoration:none; transform:translateY(-2px); }
.avatar { width:168px; height:168px; border-radius:16px; overflow:hidden; background:linear-gradient(135deg,#2f5fd0,#7c5cf6); display:grid; place-items:center; color:#fff; font-size:2.6rem; font-weight:800; font-family:var(--serif); border:1px solid var(--border); position:relative; }

section { padding:30px 0; border-top:1px solid var(--border); }

.sec-title { font-family:var(--serif); font-size:1.28rem; margin-bottom:16px; display:flex; align-items:baseline; gap:10px; }

.pub { padding:12px 0; border-bottom:1px dashed var(--border); }

.rcard:hover { border-color:var(--accent); box-shadow:0 6px 20px rgba(0,0,0,.05); }
.rcard .r-idx { display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; border-radius:7px; background:var(--accent-soft); color:var(--accent); font-size:.76rem; font-weight:700; margin-bottom:9px; }

.rcard .r-desc { font-size:.885rem; color:var(--soft); line-height:1.78; }
.rcard .r-tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
.rcard .r-tags span { font-size:.72rem; color:var(--muted); border:1px solid var(--border); padding:2px 9px; border-radius:999px; white-space:nowrap; }
.rcard .r-refs { margin-top:13px; padding-top:11px; border-top:1px dashed var(--border); }
.rcard .r-refs .ref-h { font-size:.7rem; color:var(--muted); letter-spacing:.05em; margin-bottom:6px; }
.rcard .r-refs a { display:block; font-size:.795rem; color:var(--soft); line-height:1.6; padding-left:11px; position:relative; margin-bottom:3px; }

.rcard .r-fig { border:1px solid var(--border); border-radius:10px; overflow:hidden; background:var(--bg); }
.rcard .r-fig img { display:block; width:100%; height:158px; object-fit:cover; object-position:center; }
@media (max-width:760px) {

/* 入场动画 */

  .nav-link { display:none; }

@media (prefers-reduced-motion:reduce) {
  html { scroll-behavior:auto; }
  .reveal { opacity:1; transform:none; transition:none; }
}

(function () {
  "use strict";
  var LANG_KEY = "alan-site-lang";
  var lang = "zh";
  try { lang = localStorage.getItem(LANG_KEY) || "zh"; } catch (e) {}
  if (lang !== "zh" && lang !== "en") lang = "zh";

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function pick(o) { return (o && typeof o === "object" && (o.zh !== undefined)) ? (lang === "zh" ? o.zh : o.en) : o; }

  function render() {
    document.documentElement.setAttribute("lang", lang === "zh" ? "zh-CN" : "en");
    document.getElementById("langToggle").textContent = lang === "zh" ? "EN" : "中";

    /* 固定文案 */
    document.querySelectorAll("[data-i18n]").forEach(function (n) {
      var k = n.getAttribute("data-i18n");
      if (UI[k]) n.textContent = pick(UI[k]);
    });

    /* 首屏 */
    document.getElementById("navName").textContent = lang === "zh" ? "李聃 Alan Li" : "Alan Li 李聃";
    document.getElementById("heroName").innerHTML = esc(pick(HERO.name)) + '<span class="en">' + esc(pick(HERO.nameEn)) + "</span>";
    document.getElementById("heroBio").textContent = pick(HERO.bio);
    document.getElementById("avatarInitials").textContent = lang === "zh" ? "聃" : "AL";
    var hl = document.getElementById("heroLinks");
    hl.innerHTML = "";
    HERO.links.forEach(function (l) {
      var a = document.createElement("a");
      a.href = l.href;
      if (l.href.indexOf("mailto:") !== 0 && l.href.indexOf("tel:") !== 0) { a.target = "_blank"; a.rel = "noopener noreferrer"; }
      a.textContent = pick(l.text);
      hl.appendChild(a);
    });

    /* 关于 */
    /* 研究方向卡片 */
    document.getElementById("researchList").innerHTML = RESEARCH.map(function (r, i) {
      var t = lang === "zh" ? r.zh : r.en;
      var tags = t.tags.map(function (g) { return "<span>" + esc(g) + "</span>"; }).join("");
      var fig = r.img
        ? '<div class="r-fig"><img src="' + esc(r.img) + '" alt="' + esc(lang === "zh" ? r.alt.zh : r.alt.en) + '" loading="lazy" /></div>'
        : "";
      var refs = (r.refs && r.refs.length)
        ? '<div class="r-refs"><div class="ref-h">' + (lang === "zh" ? "代表文献 · KEY REFERENCES" : "Key references") + "</div>" +
          r.refs.map(function (rf) {
            return '<a href="' + esc(rf.url) + '" target="_blank" rel="noopener noreferrer">' +
              esc(lang === "zh" ? rf.zh : rf.en) + "</a>";
          }).join("") + "</div>"
        : "";
      return '<article class="rcard reveal">' +
        '<div class="r-text">' +
        '<span class="r-idx">' + (i + 1) + "</span>" +
        '<h3 class="r-title">' + esc(t.title) + "</h3>" +
        '<p class="r-desc">' + esc(t.desc) + "</p>" +
        '<div class="r-tags">' + tags + "</div>" +
        refs +
        "</div>" + fig + "</article>";
    }).join("");

    /* 通用列表渲染 */
    function renderList(id, arr) {
      document.getElementById(id).innerHTML = arr.map(function (it) {
        return '<div class="item"><span class="when">' + esc(pick(it.when)) + '</span>' +
          '<div class="what"><b>' + pick(it.what) + "</b>" +
          (it.role ? ' · <span class="role">' + esc(pick(it.role)) + "</span>" : "") +
          (it.desc ? '<div class="desc">' + esc(pick(it.desc)) + "</div>" : "") +
          "</div></div>";
      }).join("");

    renderList("eduList", EDU);

    document.getElementById("footerText").textContent = pick(FOOTER);
    initReveal();
    bindSpy();
  }

  /* 语言切换 */
  document.getElementById("langToggle").addEventListener("click", function () {
    lang = lang === "zh" ? "en" : "zh";
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
    render();
  });

  /* 主题切换 */
  var THEME_KEY = "alan-site-theme";
  function applyTheme(t) { document.documentElement.setAttribute("data-theme", t); try { localStorage.setItem(THEME_KEY, t); } catch (e) {} }
  (function () {
    var saved = null;
    try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
    if (saved === "dark" || saved === "light") applyTheme(saved);
    else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) applyTheme("dark");
  })();
  document.getElementById("themeToggle").addEventListener("click", function () {
    applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
  });

  /* 导航高亮 */
  var spyBound = false;
  function bindSpy() {
    if (spyBound) return;
    spyBound = true;
    var links = Array.prototype.slice.call(document.querySelectorAll(".nav-link"));
    window.addEventListener("scroll", function () {
      var pos = window.scrollY + 140, cur = "";
      links.forEach(function (l) {
        var sec = document.querySelector(l.getAttribute("href"));
        if (sec && sec.offsetTop <= pos) cur = l.getAttribute("href");
      });
      links.forEach(function (l) { l.classList.toggle("active", l.getAttribute("href") === cur); });
    }, { passive: true });
  }

  /* 入场动画：必须在 render() 之后执行，
     否则动态生成的卡片（研究方向）扫不到，会一直停在 opacity:0 */
  function initReveal() {
    var targets = document.querySelectorAll(".reveal:not(.visible)");
    if ("IntersectionObserver" in window) {
      var ob = new IntersectionObserver(function (es) {
        es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add("visible"); ob.unobserve(e.target); } });
      }, { threshold: 0.08 });
      targets.forEach(function (t) { ob.observe(t); });
    } else {
      targets.forEach(function (t) { t.classList.add("visible"); });
    }
  }

  render();
})();
</script>
